name: 'dsh-vet audit'
description: >-
  Audit a DSH plugin with dsh-vet: report artifact on every run, findings
  comment on pull requests, and a zero-server grade badge committed from the
  report (D3). The scanner is fetched from npm and pinned; this action runs
  no code of its own beyond two readable scripts.
author: 'rogerdigital'

inputs:
  specifier:
    description: 'What to audit: local path (usually "."), npm package, or git URL'
    default: '.'
  version:
    description: >-
      dsh-vet version to run. The default always matches the action tag this
      file ships in (e.g. @v0.2.3 runs 0.2.3), so pinning the action ref is
      sufficient; override only to run an older scanner deliberately.
    default: '0.3.0'
  strict:
    description: 'Fail the job on findings >= high with confidence >= medium'
    default: 'false'
  fail-on:
    description: 'Override the strict threshold (critical|high|medium|low)'
    default: ''
  rules:
    description: 'Comma-separated rule ids to run (default: all)'
    default: ''
  comment:
    description: 'Comment findings on pull requests (one comment, edited in place)'
    default: 'true'
  baseline-report:
    description: >-
      Path to a baseline dsh-vet/v1 report to compare against (informational
      delta summary on PRs and in the job summary). The bytes must come from
      a trusted base revision — see the baseline recipe in action/README.md;
      a path the PR head controls is not authoritative. Empty = scan-only.
    default: ''
  commit-report:
    description: 'Publish report + badge to the dsh-vet/report branch on default-branch pushes'
    default: 'false'
  github-token:
    description: 'Token used for PR comments'
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Scan with dsh-vet
      id: scan
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p .dsh-vet
        args=(--json)
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        if [ -n "${{ inputs.fail-on }}" ]; then args+=(--fail-on "${{ inputs.fail-on }}"); fi
        if [ -n "${{ inputs.rules }}" ]; then args+=(--rules "${{ inputs.rules }}"); fi
        # Isolated install instead of `npx`: when the audited repository IS a
        # package named dsh-vet (running the action in this repo), npx resolves
        # against the local package.json and fails to find the bin.
        install_dir="${RUNNER_TEMP:-/tmp}/dsh-vet-action"
        npm install --prefix "$install_dir" --no-fund --no-audit dsh-vet@${{ inputs.version }}
        "$install_dir/node_modules/.bin/dsh-vet" "${args[@]}" ${{ inputs.specifier }} > .dsh-vet/report.json

    - name: Badge, summary, and PR comment
      if: always() && steps.scan.outcome != 'skipped'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMENT_ENABLED: ${{ inputs.comment }}
        BASELINE_REPORT: ${{ inputs.baseline-report }}
      run: node ${{ github.action_path }}/scripts/post-results.mjs

    - name: Compare against the baseline
      id: compare
      if: always() && steps.scan.outcome != 'skipped' && inputs.baseline-report != ''
      continue-on-error: true
      shell: bash
      env:
        BASELINE_REPORT: ${{ inputs.baseline-report }}
      run: |
        # Baseline bytes must come from a trusted base revision (recipe in
        # action/README.md); a checked-in path the PR head controls is not an
        # authoritative baseline. Inputs flow through env vars and quoted
        # argument arrays only.
        if [ ! -s .dsh-vet/report.json ]; then
          echo "no report produced; nothing to compare"
          exit 0
        fi
        if [ ! -f "$BASELINE_REPORT" ]; then
          echo "baseline report not found: $BASELINE_REPORT" >&2
          exit 2
        fi
        install_dir="${RUNNER_TEMP:-/tmp}/dsh-vet-action"
        bin="$install_dir/node_modules/.bin/dsh-vet"
        if [ ! -x "$bin" ]; then
          npm install --prefix "$install_dir" --no-fund --no-audit "dsh-vet@${{ inputs.version }}"
        fi
        set +e
        "$bin" diff --json "$BASELINE_REPORT" .dsh-vet/report.json > .dsh-vet/diff.json 2> .dsh-vet/diff-error.txt
        code=$?
        set -e
        # Exit 2 (usage/read/validation) produced no result: keep only the
        # diagnostics so the summary explains why comparison is unavailable.
        if [ "$code" -eq 2 ]; then
          rm -f .dsh-vet/diff.json
        fi
        exit "$code"

    - name: Upload report artifact
      if: always() && steps.scan.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        # Suffix with the job id: nothing stops a workflow from running this
        # action twice (e.g. an audit job plus a local-action smoke job), and
        # artifact names are unique per run. Includes report.json, badge.json,
        # and — when a baseline was configured — diff.json / diff-error.txt.
        name: dsh-vet-report-${{ github.job }}
        path: .dsh-vet/
        if-no-files-found: ignore

    - name: Fail on scan outcome
      if: always() && steps.scan.outcome == 'failure'
      shell: bash
      run: |
        echo "dsh-vet did not pass (scanner error or threshold breach); see steps above."
        exit 1

    - name: Fail on comparison outcome
      if: always() && steps.compare.outcome == 'failure'
      shell: bash
      run: |
        echo "dsh-vet comparison against the configured baseline did not produce a usable result; see the comparison step and the summary above."
        exit 1

    - name: Publish report and badge to the dsh-vet/report branch
      if: >-
        always() && steps.scan.outcome == 'success' && inputs.commit-report == 'true' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      run: |
        # The report branch is the badge's single source of truth (D3): the
        # badge reads it via shields.io, its history is the audit trail, and
        # it needs no permissions a protected default branch would demand —
        # no PR creation, no checks, no approval gates.
        # Publish only when the meaningful content changed: reports always
        # differ by scanner.ranAt, and every default-branch push re-runs this.
        if git fetch origin dsh-vet/report --depth=1 2>/dev/null && \
           git show 'FETCH_HEAD:.dsh-vet/report.json' >/dev/null 2>&1; then
          if diff <(jq -S 'del(.scanner.ranAt)' .dsh-vet/report.json) <(git show 'FETCH_HEAD:.dsh-vet/report.json' | jq -S 'del(.scanner.ranAt)') >/dev/null; then
            echo "report unchanged beyond ranAt; nothing to publish"
            exit 0
          fi
        fi
        # Plain --force: dsh-vet/report is a disposable bot branch rebuilt
        # from the default branch on every run.
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git checkout -B dsh-vet/report
        git add .dsh-vet
        git commit -m "chore: update dsh-vet report and badge"
        git push --force origin dsh-vet/report
