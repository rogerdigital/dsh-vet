name: 'dsh-vet audit'
description: >-
  Audit a DSH plugin with dsh-vet: report artifact on every run, findings
  comment on pull requests, and a zero-server grade badge committed from the
  report (D3). The scanner is fetched from npm and pinned; this action runs
  no code of its own beyond two readable scripts.
author: 'rogerdigital'

inputs:
  specifier:
    description: 'What to audit: local path (usually "."), npm package, or git URL'
    default: '.'
  version:
    description: >-
      dsh-vet version to run. The default always matches the action tag this
      file ships in (e.g. @v0.2.3 runs 0.2.3), so pinning the action ref is
      sufficient; override only to run an older scanner deliberately.
    default: '0.2.5'
  strict:
    description: 'Fail the job on findings >= high with confidence >= medium'
    default: 'false'
  fail-on:
    description: 'Override the strict threshold (critical|high|medium|low)'
    default: ''
  rules:
    description: 'Comma-separated rule ids to run (default: all)'
    default: ''
  comment:
    description: 'Comment findings on pull requests (one comment, edited in place)'
    default: 'true'
  commit-report:
    description: 'Commit .dsh-vet/report.json + badge.json on pushes to the default branch'
    default: 'false'
  github-token:
    description: 'Token used for PR comments'
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Scan with dsh-vet
      id: scan
      continue-on-error: true
      shell: bash
      run: |
        mkdir -p .dsh-vet
        args=(--json)
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        if [ -n "${{ inputs.fail-on }}" ]; then args+=(--fail-on "${{ inputs.fail-on }}"); fi
        if [ -n "${{ inputs.rules }}" ]; then args+=(--rules "${{ inputs.rules }}"); fi
        # Isolated install instead of `npx`: when the audited repository IS a
        # package named dsh-vet (running the action in this repo), npx resolves
        # against the local package.json and fails to find the bin.
        install_dir="${RUNNER_TEMP:-/tmp}/dsh-vet-action"
        npm install --prefix "$install_dir" --no-fund --no-audit dsh-vet@${{ inputs.version }}
        "$install_dir/node_modules/.bin/dsh-vet" "${args[@]}" ${{ inputs.specifier }} > .dsh-vet/report.json

    - name: Badge, summary, and PR comment
      if: always() && steps.scan.outcome != 'skipped'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        COMMENT_ENABLED: ${{ inputs.comment }}
      run: node ${{ github.action_path }}/scripts/post-results.mjs

    - name: Upload report artifact
      if: always() && steps.scan.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        # Suffix with the job id: nothing stops a workflow from running this
        # action twice (e.g. an audit job plus a local-action smoke job), and
        # artifact names are unique per run.
        name: dsh-vet-report-${{ github.job }}
        path: .dsh-vet/
        if-no-files-found: ignore

    - name: Fail on scan outcome
      if: always() && steps.scan.outcome == 'failure'
      shell: bash
      run: |
        echo "dsh-vet did not pass (scanner error or threshold breach); see steps above."
        exit 1

    - name: Publish report and badge to the default branch
      if: >-
        always() && steps.scan.outcome == 'success' && inputs.commit-report == 'true' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # Reports always differ by scanner.ranAt; publish only when the
        # meaningful content changed, or every push would raise a PR.
        if [ -f .dsh-vet/report.json ] && git show 'HEAD:.dsh-vet/report.json' >/dev/null 2>&1; then
          if diff <(jq -S 'del(.scanner.ranAt)' .dsh-vet/report.json) <(git show 'HEAD:.dsh-vet/report.json' | jq -S 'del(.scanner.ranAt)') >/dev/null; then
            echo "report unchanged beyond ranAt; nothing to publish"
            exit 0
          fi
        fi
        # Protected branches (required status checks) reject direct pushes, so
        # the update travels as an auto-merged PR: the badge stays zero-touch
        # and every value change is reviewable in git history (D3).
        branch='dsh-vet/report'
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git checkout -B "$branch"
        git add .dsh-vet
        git commit -m "chore: update dsh-vet report and badge"
        # Plain --force: dsh-vet/report is a disposable bot branch rebuilt
        # from main on every run. --force-with-lease rejects as "stale info"
        # whenever the branch survived remotely (an unmerged PR or a racing
        # run) while the runner's shallow checkout had never fetched it.
        git push --force origin "$branch"
        # Idempotent: reuse the PR when the branch already has one. Auto-merge
        # needs an explicit merge method, or gh prints usage and exits nonzero.
        gh pr view "$branch" --json number >/dev/null 2>&1 || \
          gh pr create --head "$branch" --title 'chore: update dsh-vet report and badge' \
            --body "Zero-server badge refresh (D3): the report changed beyond \`scanner.ranAt\`. Run: ${RUN_URL}"
        gh pr merge "$branch" --auto --merge \
          || echo "dsh-vet: auto-merge unavailable; the badge PR awaits manual merge"
