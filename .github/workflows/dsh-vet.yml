# dsh-vet self-audit via the published action: PR comment + report artifact
# on every pull request, committed report + grade badge on main. The audit
# targets the published npm artifact (specifier 'dsh-vet') rather than this
# working tree — the fixtures in this repo are intentional offenders.
name: dsh-vet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rogerdigital/dsh-vet/action@v0.2.0
        with:
          specifier: 'dsh-vet'
          commit-report: true
