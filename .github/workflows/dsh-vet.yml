# dsh-vet self-audit via the published action: PR comment + report artifact
# on every pull request, committed report + grade badge on main. The audit
# targets the published npm artifact (specifier 'dsh-vet') rather than this
# working tree — the fixtures in this repo are intentional offenders.
name: dsh-vet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Local action: self-hosting must not lag a release behind the repo.
      # The scanner version bridges the window between the version bump on
      # main and the npm publish — release prep bumps this line.
      - uses: ./action
        with:
          specifier: 'dsh-vet'
          version: '0.2.3'
          commit-report: true

  # Exercise the working-tree action on every PR: the published tag lags the
  # repo, so without this nothing tests action/ changes until the next tag.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./action
        with:
          specifier: 'fixtures/offender-kitchen-sink'
          version: '0.2.3'
          comment: 'false'
